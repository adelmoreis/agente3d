<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html, body {
  width: 1080px;
  height: 1080px;
  overflow: hidden;
  background: #15112e;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.ad-card {
  width: 1080px;
  height: 1080px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 60px 75px 55px;
  text-align: center;
  color: #ffffff;
  background: 
    radial-gradient(900px 550px at 15% 12%, rgba(255, 109, 90, 0.45), transparent 65%),
    radial-gradient(900px 550px at 85% 88%, rgba(91, 78, 232, 0.5), transparent 65%),
    linear-gradient(160deg, #171338 0%, #261e5a 55%, #35256e 100%);
  position: relative;
  overflow: hidden;
}

/* Grid overlay */
.ad-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255, 255, 255, 0.2) 1.5px, transparent 1.5px);
  background-size: 32px 32px;
  opacity: 0.7;
  pointer-events: none;
}

.ad-card > * {
  position: relative;
  z-index: 2;
}

/* Header exactly matching screenshot 3 */
.header-cl {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 36px;
}
.brand-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.blogo {
  height: 72px;
  width: auto;
  filter: drop-shadow(0 0 16px rgba(232, 118, 26, 0.6));
}
.brand-sub {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd2c9;
}
.cx {
  font-style: normal;
  font-size: 36px;
  font-weight: 300;
  color: #b9b2ff;
  line-height: 1;
}
.brand-n8n {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.brand-n8n img {
  height: 64px;
  width: auto;
  filter: drop-shadow(0 0 18px rgba(234, 75, 113, 0.7));
}
.brand-n8n b {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #ffd2c9;
}

/* Headline */
.headline-box h1 {
  font-size: 64px;
  line-height: 1.15;
  font-weight: 900;
  letter-spacing: -0.02em;
  color: #ffffff;
  text-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
}
.headline-box h1 em {
  font-style: normal;
  color: #ff6d5a;
  background: linear-gradient(135deg, #ff7e6f, #ff4c36);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Shortened, high-impact subtext */
.subtext-box {
  max-width: 860px;
  font-size: 24px;
  line-height: 1.45;
  font-weight: 500;
  color: #e6e2fc;
  text-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
.subtext-box b.highlight {
  color: #4ade80;
  font-weight: 700;
}
.subtext-box b.orange {
  color: #fbbf24;
  font-weight: 700;
}

/* Mentors row */
.mentors-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 36px;
}
.mentor-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.mentor-avatar {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45), 0 0 0 4px rgba(255, 255, 255, 0.25);
}
.mentor-avatar svg {
  width: 78px;
  height: 78px;
}
.mentor-name {
  font-size: 15px;
  font-weight: 700;
  color: #f1eeff;
  letter-spacing: 0.02em;
}

/* 3 Clean, Glowing, High-Contrast Badges */
.badges-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
}
.badge {
  padding: 13px 26px;
  border-radius: 999px;
  font-size: 18px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 8px;
}
.badge-orange {
  background: linear-gradient(135deg, rgba(255, 109, 90, 0.38), rgba(255, 109, 90, 0.18));
  border: 2px solid #ff6d5a;
  color: #ffe4df;
  box-shadow: 0 0 20px rgba(255, 109, 90, 0.4);
}
.badge-purple {
  background: linear-gradient(135deg, rgba(168, 85, 247, 0.38), rgba(168, 85, 247, 0.18));
  border: 2px solid #c084fc;
  color: #f5edff;
  box-shadow: 0 0 20px rgba(168, 85, 247, 0.35);
}
.badge-green {
  background: linear-gradient(135deg, rgba(34, 197, 94, 0.38), rgba(34, 197, 94, 0.18));
  border: 2px solid #4ade80;
  color: #dcfce7;
  box-shadow: 0 0 22px rgba(74, 222, 128, 0.45);
}

/* Big CTA */
.cta-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.cta-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 20px 72px;
  border-radius: 999px;
  background: linear-gradient(135deg, #ff6d5a 0%, #ee3a22 100%);
  color: #ffffff;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 0.03em;
  box-shadow: 0 12px 35px rgba(238, 58, 34, 0.55), 0 0 0 3px rgba(255, 255, 255, 0.3);
}
.cta-footnote {
  font-size: 16px;
  font-weight: 500;
  color: #c4bfe8;
}
</style></head><body><div class="ad-card"></div></body></html>

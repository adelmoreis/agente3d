<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chatwoot Academia Agente3d</title>
<style>
:root{--b:#1f93ff;--bd:#1578d4;--bs:#e8f3ff;--bg:#f4f6fb;--line:#ebf0f5;--fg:#1f2d3d;--mut:#6e7b8c;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
button{font:inherit;cursor:pointer;color:inherit}.hidden{display:none!important}
.center{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#eaf4ff,#f7f9fc 60%)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 40px rgba(31,147,255,.12);padding:30px;width:100%;max-width:680px}
.card h1{margin:0 0 6px;font-size:26px;line-height:1.2}.sub{color:var(--mut);margin:0 0 14px}
.logo{display:flex;gap:10px;align-items:center;font-weight:800;font-size:20px;margin-bottom:16px}.logo i{width:30px;height:30px;border-radius:50%;background:var(--b);display:inline-grid;place-items:center}.logo i:after{content:"";width:13px;height:13px;border-radius:50%;background:#fff}
input.t{width:100%;padding:11px 12px;border:1px solid #d5dde7;border-radius:8px;font:inherit;margin-bottom:12px}input.t:focus,textarea:focus{outline:2px solid var(--b);border-color:transparent}
.btn{background:var(--b);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600}.btn:hover{background:var(--bd)}.btn.g{background:#fff;color:var(--fg);border:1px solid #d5dde7}.btn.ok{background:var(--ok)}.btn:disabled{background:#cbd5e1;cursor:not-allowed}
.blk{position:fixed;inset:0;z-index:900;background:linear-gradient(160deg,#0f172a,#1e293b);display:grid;place-items:center;padding:20px}
.blkc{background:#fff;border-radius:20px;padding:34px 30px;max-width:420px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.blki{font-size:44px;line-height:1;margin-bottom:10px}.blkc h2{margin:0 0 8px;font-size:22px;color:#1e293b}.blkc p{margin:0;color:#64748b;line-height:1.5}
.lerr{color:#ef4444;font-size:13px;margin:8px 0 14px;padding:8px 12px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;text-align:left}
.field{margin-bottom:12px;text-align:left}.field label{display:block;font-size:12.5px;font-weight:600;color:var(--fg);margin-bottom:4px}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}.feats div{background:var(--bs);border-radius:10px;padding:10px 12px;font-size:13px}.feats b{display:block}
.mundo{margin:16px 0}.mundo h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between}
.mis{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff;width:100%;text-align:left}
.mis:hover:not(:disabled){border-color:var(--b);background:var(--bs)}.mis:disabled{opacity:.5;cursor:not-allowed}.mis b{color:var(--b);margin-right:8px}.tag{font-size:12px;color:var(--ok);font-weight:700;white-space:nowrap}
.xp{background:#fff7e6;color:#92400e;border-radius:20px;padding:3px 10px;font-weight:700;font-size:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 16px;background:#fff;border-bottom:1px solid var(--line)}
.lab{display:grid;grid-template-columns:310px 1fr;height:calc(100vh - 53px)}
@media(max-width:900px){.lab{grid-template-columns:1fr;height:auto}.mentor{border-right:0;border-bottom:1px solid var(--line)}}
.mentor{background:#fff;border-right:1px solid var(--line);padding:16px;overflow:auto}
.mh{display:flex;gap:10px;align-items:center;margin-bottom:8px}.av{width:38px;height:38px;border-radius:50%;background:var(--b);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.bubble{background:var(--bs);border-radius:4px 14px 14px 14px;padding:12px;margin:8px 0}.hint{background:#fff7e6;border:1px solid #fcd34d;border-radius:10px;padding:10px;margin:8px 0;font-size:13px}
.dots{display:flex;gap:5px;margin:6px 0}.dots i{flex:1;height:6px;border-radius:4px;background:var(--line)}.dots i.on{background:var(--b)}
.sim{min-width:0;background:#fff;height:100%}
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0}
.side button{width:40px;height:40px;border:0;border-radius:10px;background:transparent;font-size:18px}.side button.on,.side button:hover{background:var(--bs)}
.work{display:grid;grid-template-columns:230px minmax(240px,320px) 1fr 250px;min-width:0}.work.s{grid-template-columns:230px 1fr}.work.c{grid-template-columns:minmax(240px,320px) 1fr}
@media(max-width:1250px){.work{grid-template-columns:200px 280px 1fr}.work .rp{display:none}}@media(max-width:900px){.work,.work.s,.work.c{grid-template-columns:1fr}.work>.nav{display:none}}
.nav{border-right:1px solid var(--line);padding:12px 8px}.nav h5{margin:12px 8px 4px;font-size:11px;text-transform:uppercase;color:var(--mut);letter-spacing:.05em}
.nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:8px;font-size:13.5px}.nav button:hover,.nav button.on{background:var(--bs);color:var(--bd)}
.list{border-right:1px solid var(--line);overflow:auto}.list h4{margin:0;padding:14px;font-size:16px}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line)}.tabs button{border:0;background:none;padding:8px;color:var(--mut);border-bottom:2px solid transparent;font-size:13px}.tabs button.on{color:var(--b);border-color:var(--b);font-weight:600}
.conv{display:flex;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:11px 14px}.conv:hover,.conv.on{background:#f4f8fd}.conv .av{width:34px;height:34px;font-size:13px}.conv small{color:var(--mut);display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:190px}
.chat{display:flex;flex-direction:column;min-height:440px;min-width:0}.chat .hd{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.msgs{flex:1;padding:14px;display:flex;flex-direction:column;gap:8px;overflow:auto;background:#f8fafc}.m{max-width:75%;padding:8px 12px;border-radius:12px;word-break:break-word}.m.in{background:#fff;border:1px solid var(--line)}.m.out{background:var(--b);color:#fff;align-self:flex-end}.m.note{background:#fff3cd;border:1px dashed var(--warn);align-self:flex-end}
.comp{border-top:1px solid var(--line);padding:10px;background:#fff}.comp.pv{background:#fffbeb}.tb{display:flex;gap:6px;margin-bottom:8px}.tb button{border:0;background:#f1f5f9;border-radius:8px;padding:5px 12px}.tb button.on{background:var(--bs);color:var(--bd);font-weight:600}.pv .tb button.on{background:#fde68a;color:#92400e}
textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;resize:none;height:56px}
.empty{display:grid;place-items:center;height:100%;min-height:200px;color:var(--mut);padding:20px;text-align:center}
.rp{border-left:1px solid var(--line);padding:14px;overflow:auto;font-size:13px}.rp h5{margin:14px 0 6px;font-size:12px;text-transform:uppercase;color:var(--mut)}
.sel{display:block;width:100%;text-align:left;border:1px solid #d5dde7;border-radius:8px;background:#fff;padding:7px 10px}.menu{border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 8px 22px rgba(0,0,0,.12);margin:4px 0}.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px}.menu button:hover{background:var(--bs)}
.lbl{display:inline-block;background:var(--bs);color:#1e40af;border-radius:6px;padding:2px 8px;font-size:12px;margin:2px}
.pg{padding:20px;overflow:auto}.pg h3{margin:0 0 4px}.row{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff;width:100%;text-align:left}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:5;padding:16px}.modal .box{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:440px}
.chan{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.chan button{border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px;text-align:left}.chan button:hover{border-color:var(--b)}
.vz{margin-left:auto;display:flex;gap:6px}.vz button{border:1px solid #d5dde7;background:#fff;border-radius:8px;padding:4px 9px}
.pulse{animation:p 1.4s infinite;position:relative;z-index:1}@keyframes p{0%,100%{box-shadow:0 0 0 0 rgba(31,147,255,.75)}50%{box-shadow:0 0 0 8px rgba(31,147,255,0)}}
.q{margin:14px 0}.q label{display:block;padding:9px 11px;border:1px solid var(--line);border-radius:8px;margin:5px 0;cursor:pointer}.q label:hover{border-color:var(--b)}
.good{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}

.capa{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px 20px 40px;text-align:center;color:#fff;background:radial-gradient(900px 500px at 12% 8%,rgba(255,138,76,.30),transparent 60%),radial-gradient(800px 520px at 92% 92%,rgba(31,147,255,.45),transparent 60%),linear-gradient(160deg,#141a45,#1d2c7c 60%,#2a3c9a);position:relative;overflow:hidden}
.capa:before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.5px);background-size:26px 26px;opacity:.5;pointer-events:none}.capa>*{position:relative}
.capa .cl{display:flex;align-items:center;justify-content:center;gap:clamp(14px,4vw,34px);flex-wrap:wrap;font-weight:700;letter-spacing:.14em;font-size:12px;text-transform:uppercase;color:#cfe3ff}
.capa .cl>div{display:flex;flex-direction:column;align-items:center;gap:8px}.capa .cl img{height:clamp(84px,14vw,120px);width:auto;filter:drop-shadow(0 0 12px rgba(255,255,255,.45)) drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.capa .cx{font-style:normal;font-size:34px;color:#9fc8ff;font-weight:300}
.cwl{display:flex;align-items:center;gap:8px;font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:0;text-transform:none;color:#fff}.cwl i{width:clamp(38px,6vw,52px);height:clamp(38px,6vw,52px);border-radius:50%;background:#1f93ff;display:grid;place-items:center;box-shadow:0 0 18px rgba(31,147,255,.7)}.cwl i:after{content:"";width:42%;height:42%;border-radius:50%;background:#fff}
.capa h1{font-size:clamp(34px,7vw,66px);line-height:1.05;margin:6px 0;font-weight:800;max-width:980px}.capa h1 em{font-style:normal;background:linear-gradient(90deg,#4aa8ff,#7be0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.capa p.tag{white-space:normal;font-weight:400;max-width:640px;font-size:clamp(16px,2.4vw,20px);line-height:1.6;color:#e6eeff;margin:0}.k-r{color:#ff5d73}.k-g{color:#4ade80}.k-o{color:#ffb84a}
.cast{display:flex;gap:clamp(10px,2.6vw,26px);flex-wrap:wrap;justify-content:center;align-items:flex-start;margin:8px 0}.cast figure{margin:0;width:clamp(78px,12vw,124px);font-size:13px;font-weight:700;color:#dfe9ff}
.cast .ci{width:100%;aspect-ratio:1;border-radius:50%;background:#fff;border:4px solid #8b7bff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.3);margin-bottom:6px;overflow:hidden}.cast .ci svg{width:84%;height:84%}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.chips span{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);border-radius:999px;padding:8px 18px;color:#dfe9ff;font-size:15px}.chips .k100{background:#ffb84a;color:#2b1a00;font-weight:700;border-color:#ffb84a}
.go{background:#1f93ff;color:#fff;border:3px solid #fff;border-radius:999px;padding:16px 46px;font-size:21px;font-weight:800;cursor:pointer;box-shadow:0 8px 26px rgba(31,147,255,.55);margin-top:8px}.go:hover{background:#3aa3ff;transform:translateY(-1px)}
.capa small{color:#b7c8ee;max-width:560px}.capa small.cr{font-size:11.5px;opacity:.75}
.sup{position:fixed;right:12px;bottom:12px;background:#fff;color:#14213d;border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px;text-decoration:none;box-shadow:0 4px 16px rgba(0,0,0,.3);z-index:9}.sup i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#22c55e;margin-right:7px}
.cw{--p:#2781f6;display:flex;min-width:0;background:#fff;color:#1f2d3d;font-size:13.5px;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.cw button{border:0;background:none}.cw .sp{flex:1}.cw .ic{flex:none}.cw .mu{color:#8493a5;display:inline-grid;place-items:center}
.cw .nv{width:208px;flex:none;background:#f9f9f9;border-right:1px solid #ececec;overflow-y:auto;padding:8px 8px 70px;position:relative}
.cw .ws{display:flex;align-items:center;gap:8px;padding:6px 6px 10px}.cw .ws b{flex:1;font-weight:600}.cw .lg{width:18px;height:18px;border-radius:50%;background:var(--p);display:grid;place-items:center}.cw .lg:after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.cw .srch{display:flex;gap:6px;margin-bottom:8px}.cw .sb{flex:1;display:flex;align-items:center;gap:6px;border:1px solid #e3e3e3;background:#fff;border-radius:8px;padding:6px 8px;color:#8b8b8b;font-size:13px}
.cw .ib{width:30px;height:30px;border:1px solid #e3e3e3!important;background:#fff!important;border-radius:8px;display:inline-grid;place-items:center;color:#5b6775}
.cw .ni{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 8px;border-radius:8px;color:#3c4858;font-size:13.5px}.cw .ni:hover,.cw .si:hover{background:#efefef}.cw .ni.on{background:#e8e8e8;font-weight:500}.cw .ni span{flex:1}
.cw .bd{font-style:normal;background:#fff;border:1px solid #e6e6e6;border-radius:6px;padding:0 6px;font-size:12px;color:#555}
.cw .cv{display:inline-grid;transition:.2s;color:#8b8b8b}.cw .cv.up{transform:rotate(180deg)}
.cw .kids{margin:2px 0 4px 17px;padding-left:8px;border-left:2px solid #e6e6e6}.cw .si{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 8px;border-radius:8px;color:#3c4858;font-size:13.5px}.cw .si.on{background:#e8e8e8;font-weight:500}
.cw .sq{display:inline-block;width:8px;height:8px;border-radius:2px;flex:none}
.cw .uc{position:sticky;bottom:-70px;margin:12px -8px -70px;background:#f9f9f9;border-top:1px solid #ececec;padding:10px 12px;display:flex;gap:9px;align-items:center}.cw .uc small{display:block;color:#7b8794;font-size:12px}.cw .uc b{font-size:13px}
.cw .av2{width:28px;height:28px;border-radius:50%;background:#e5dcff;color:#5b3fc8;display:grid;place-items:center;font-weight:600;font-size:12px}
.cw .mn3{flex:1;display:flex;min-width:0}.cw .mn2{flex:1;display:flex;min-width:0;overflow:auto}
.cw .lc{width:270px;flex:none;border-right:1px solid #ececec;display:flex;flex-direction:column;min-width:0}
.cw .lh{display:flex;align-items:center;gap:8px;padding:12px 12px 6px}.cw .lh b{font-size:16px}.cw .pill{background:#eee;border-radius:6px;padding:1px 7px;font-size:11.5px;color:#555}
.cw .tb2{display:flex;gap:2px;padding:0 8px;border-bottom:1px solid #ececec}.cw .tb2 button{padding:8px 6px;color:#68727d;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}.cw .tb2 button.on{color:var(--p);border-color:var(--p);font-weight:600}
.cw .tb2 em{font-style:normal;background:#eef0f3;border-radius:6px;padding:0 6px;font-size:11.5px;color:#5b6775}.cw .tb2 .on em{background:#e3efff;color:var(--p)}
.cw .cl{overflow:auto;flex:1}.cw .cv2{display:block;width:100%;text-align:left;padding:10px 12px 9px;border-bottom:1px solid #f0f0f0;background:#fff}.cw .cv2:hover,.cw .cv2.on{background:#f5f6f8}
.cw .ci1{display:flex;align-items:center;gap:5px;color:#6b7785;font-size:11.5px;margin-bottom:5px}.cw .cr{display:flex;gap:9px}.cw .cb{flex:1;min-width:0}.cw .cn1{display:flex;justify-content:space-between;gap:6px}.cw .cn1 b{font-weight:600;font-size:14px}.cw .cn1 small{color:#8b95a1;font-size:11.5px;white-space:nowrap}
.cw .pv{display:block;color:#68727d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cw .pv .ic{vertical-align:-2px}
.cw .av3{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;color:#4a3a5a;flex:none}.cw .av4{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;color:#4a3a5a}
.cw .ch{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}.cw .chh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #ececec}.cw .hn{display:flex;flex-direction:column;line-height:1.25}.cw .hn small{color:#6b7785;font-size:12px;display:flex;align-items:center;gap:4px}
.cw .rs{display:inline-flex;align-items:center;gap:6px;border:1px solid #d9dee5!important;border-radius:8px;padding:6px 12px;background:#fff!important;font-weight:500}.cw .okp{color:#12a150;font-weight:600}
.cw .mg{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff}
.cw .mb{max-width:78%;padding:9px 12px;border-radius:12px;word-break:break-word}.cw .mb small{display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-top:4px;font-size:11px;color:#7b8794}
.cw .mb.in{background:#f0f0f0;border-bottom-left-radius:4px;align-self:flex-start}.cw .mb.out{background:#dcebfd;border-bottom-right-radius:4px;align-self:flex-end}.cw .mb.note{background:#fff1c2;border-bottom-right-radius:4px;align-self:flex-end}
.cw .cp{margin:0 12px 12px;border:1px solid #e3e6ea;border-radius:12px;background:#fff;padding:8px 10px}.cw .cp.pv{background:#fffaeb;border-color:#f3dc8b}
.cw .cpt,.cw .cpb{display:flex;align-items:center;gap:10px}.cw .seg{display:inline-flex;background:#f0f1f3;border-radius:8px;padding:3px}.cw .seg button{padding:4px 12px;border-radius:6px;color:#4b5663}.cw .seg button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:500}
.cw .cp textarea{width:100%;border:0;outline:0;resize:none;height:58px;padding:8px 2px;font:inherit;background:transparent}.cw .cp textarea.pulse{box-shadow:none;outline:2px solid var(--p);border-radius:6px}
.cw .env{background:var(--p)!important;color:#fff;border-radius:8px;padding:7px 14px;font-weight:600}
.cw .emp{margin:auto;text-align:center;color:#4b5663;padding:20px}.cw .ill{width:84px;height:84px;border-radius:50%;background:#eaf2ff;color:var(--p);display:grid;place-items:center;margin:0 auto 14px}
.cw .kb{margin:10px 0;color:#4b5663}.cw kbd{background:#f3f3f3;border:1px solid #e2e2e2;border-radius:6px;padding:3px 9px;margin-right:4px;font:inherit}
.cw .rp{width:250px;flex:none;border-left:1px solid #ececec;overflow:auto}.cw .rph{display:flex;justify-content:space-between;padding:14px;border-bottom:1px solid #ececec}.cw .rpb{padding:14px}.cw .rpb h4{margin:8px 0 10px;font-size:16px}
.cw .inf{display:flex;gap:8px;align-items:center;color:#4b5663;padding:3px 0}.cw .inf .ic{color:#8b95a1}
.cw .acc{border:1px solid #eceff2;border-radius:10px;padding:10px 12px;margin-top:12px}.cw .acch{display:flex;justify-content:space-between;font-weight:600;margin-bottom:6px}

<script>
const KEY='chatwootAcademiaAgente3d_sim_v2';

/* ---------- Camada de Autenticação e Sincronização em Tempo Real (Agente3D Multi-Cursos) ---------- */
function uname(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim().replace(/\s+/g,'.').replace(/[^a-z0-9_.@+-]/g,'').slice(0,40);}
function b64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function unb64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function pwHash(pw,salt){
  if(!window.crypto||!crypto.subtle)return Promise.reject('nocrypto');
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){
    return crypto.subtle.deriveBits({name:'PBKDF2',salt:unb64(salt),iterations:100000,hash:'SHA-256'},k,256);
  }).then(b64);
}

let CL_TOK = '', CL_LOGIN = null, CL_SID = null, CL_UNL = null, CL_STATUS = null;

function api(method, path, body) {
  return fetch('/api/' + path, {
    method: method,
    headers: { 'Content-Type': 'application/json', 'X-Token': CL_TOK },
    body: body == null ? undefined : JSON.stringify(body),
    cache: 'no-store'
  }).then(function(r) {
    return r.json().catch(function() { return {}; }).then(function(j) {
      if (!r.ok) {
        var e = new Error(j.err || ('http' + r.status));
        e.code = j.err || r.status;
        e.status = r.status;
        throw e;
      }
      return j;
    });
  });
}

function doLogin(user, pw, known) {
  var u = uname(user);
  if (!u || (!pw && !known)) return Promise.reject('empty');
  return api('GET', 'salt?user=' + encodeURIComponent(u)).then(function(j) {
    if (!j.salt) throw 'nouser';
    return known ? known : pwHash(pw, j.salt);
  }).then(function(h) {
    return api('POST', 'login', { user: u, h: h }).then(function(res) {
      if (res.d && res.d.status === 'bloqueado') throw 'bloqueado';
      CL_TOK = res.token;
      return { u: u, h: h, d: res.d };
    }, function(e) {
      throw (e === 'bloqueado' || (e && (e.code === 'bloqueado' || e.status === 403))) ? 'bloqueado' :
            (e && e.code === 'bad') ? 'bad' :
            (e && e.code === 'nouser') ? 'nouser' :
            (e && e.code === 'rate') ? 'rate' : 'read';
    });
  });
}

function applyStatus() {
  var st = CL_STATUS, old = document.getElementById('blk');
  var blocked = st && st.status === 'bloqueado';
  if (!blocked) {
    if (old) old.remove();
    return;
  }
  if (old) return;
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
  var w = document.createElement('div');
  w.id = 'blk';
  w.className = 'blk';
  w.innerHTML = `
    <div class="blkc">
      <div class="blki">&#9208;</div>
      <h2>Seu acesso está pausado</h2>
      <p>Fale com o seu gestor para voltar a estudar na Academia Chatwoot. Seu progresso está guardado e nada foi perdido.</p>
    </div>`;
  document.body.appendChild(w);
}

function enterSession(r) {
  if (r.d && r.d.status === 'bloqueado') {
    logout();
    loginView('Seu acesso a este curso está pausado ou não liberado. Fale com o seu gestor.');
    return;
  }
  CL_SID = r.d.sid;
  CL_LOGIN = r.u;
  CL_STATUS = r.d;
  try { localStorage.setItem(KEY + '_sess', JSON.stringify({ u: r.u, h: r.h })); } catch (e) {}
  S.logged = true;
  if (!S.name && r.d.name) S.name = r.d.name;
  save();

  // Escuta status de login em tempo real
  if (CL_UNL) { try { clearInterval(CL_UNL); } catch (e) {} }
  var lastK = '';
  CL_UNL = setInterval(function() {
    api('GET', 'doc?path=logins/' + encodeURIComponent(r.u)).then(function(j) {
      if (j && j.data) {
        CL_STATUS = j.data;
        applyStatus();
      } else {
        logout();
      }
    }).catch(function() {});
  }, 2000);

  applyStatus();
  if (S.name && S.av >= 0) home(); else welcome();
}

function logout() {
  if (CL_UNL) { try { clearInterval(CL_UNL); } catch (e) {} CL_UNL = null; }
  try { localStorage.removeItem(KEY + '_sess'); } catch (e) {}
  CL_TOK = ''; CL_LOGIN = null; CL_SID = null; CL_STATUS = null;
  S.logged = false;
  var b = document.getElementById('blk'); if (b) b.remove();
  loginView();
}

function loginView(errType) {
  limpaDock();
  CUR = { view: 'login', k: null };
  app.innerHTML = `
    <div class="center">
      <div class="card" style="max-width:440px;">
        <div class="logo"><i></i>Chatwoot Academia Agente3d</div>
        <h1 style="font-size:24px;">Entrar</h1>
        <p class="sub">Use o usuário e a senha que o seu gestor criou para você. Seu progresso fica salvo na sua conta.</p>
        <form id="f-login">
          <div class="field">
            <label for="lu">Usuário</label>
            <input class="t" id="lu" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required style="margin-bottom:12px;">
          </div>
          <div class="field">
            <label for="lp">Senha</label>
            <input class="t" id="lp" type="password" autocomplete="current-password" required style="margin-bottom:8px;">
          </div>
          <p class="lerr" id="le" role="alert" style="display:${errType ? 'block' : 'none'};">${errType || ''}</p>
          <button class="btn" type="submit" id="go-login" style="width:100%; padding:12px; font-size:15px; margin-top:6px;">Entrar no Curso</button>
        </form>
        <p style="margin-top:14px; font-size:12px; color:var(--mut); text-align:center;">
          Esqueceu a senha ou ainda não tem acesso? Fale com o seu gestor.
        </p>
      </div>
    </div>`;

  const er = document.getElementById('le');
  const btn = document.getElementById('go-login');
  function fail(msg) {
    er.textContent = msg;
    er.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Entrar no Curso';
  }

  document.getElementById('f-login').onsubmit = function(e) {
    e.preventDefault();
    er.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Entrando...';
    const u = document.getElementById('lu').value.trim();
    const p = document.getElementById('lp').value.trim();

    doLogin(u, p).then(enterSession).catch(function(x) {
      fail(
        x === 'nocrypto' ? 'Este navegador não consegue validar a senha. Tente outro navegador.' :
        x === 'empty' ? 'Escreva o usuário e a senha.' :
        x === 'nouser' ? 'Não encontrei esse usuário. Digite o usuário que o gestor passou (sem espaços), não o nome.' :
        x === 'rate' ? 'Muitas tentativas. Aguarde alguns minutos e tente de novo.' :
        x === 'bloqueado' ? 'Seu acesso a este curso está pausado ou não liberado. Fale com o seu gestor.' :
        x === 'read' ? 'Não consegui consultar o cadastro agora. Confira a internet e tente de novo.' :
        'Senha incorreta. Confira e tente de novo.'
      );
    });
  };

  document.getElementById('free-mode').onclick = function(e) {
    e.preventDefault();
    S.logged = true;
    save();
    if (S.name && S.av >= 0) home(); else welcome();
  };

  setTimeout(function() {
    const el = document.getElementById('lu');
    if (el) el.focus();
  }, 50);
}

function tutorCtx(){if(CUR.view==='lab'&&CUR.k)return CUR.k;if(CUR.view==='quiz')return CUR.k;return ALL.find(x=>!S.done[x[0]]&&lib(x[0]))?ALL.find(x=>!S.done[x[0]]&&lib(x[0]))[0]:'geral'}
function tutorMatch(text){const t=nrm(text),c=tutorCtx();let best=null,bs=0;
 [c,'geral'].concat(Object.keys(TFAQ)).filter((x,i,a)=>a.indexOf(x)===i).forEach(k=>(TFAQ[k]||[]).forEach(it=>{let sc=0;it.k.forEach(w=>{if(t.includes(nrm(w)))sc+=w.length>4?2:1});if(k===c)sc+=.5;if(sc>bs){bs=sc;best=it}}));return bs>=2?best:null}
function tutorDiagnose(){const L=[];let nx='';
 if(CUR.view==='home'){L.push('Você está na tela principal, vendo o sumário.');const n=ALL.find(x=>!S.done[x[0]]&&lib(x[0]));nx=n?`Clique em "${(Object.keys(S.done).length?'Continuar de onde parei':'Começar o curso')}".`:'Você concluiu tudo o que está disponível por enquanto.'}
 else if(CUR.view==='quiz'){L.push('Você está no '+TCTX[CUR.k]+'.');nx='Marque uma resposta em cada pergunta e clique em Corrigir. Precisa de 4 acertos.'}
 else{const m=MIS[ST.k],fim=ST.i>=m.steps.length;L.push('Você está na '+TCTX[ST.k]+' ('+m.t.split('·')[1].trim()+').');L.push('Passos feitos: '+Math.min(ST.i,m.steps.length)+' de '+m.steps.length+'.');if(ST.err)L.push('O último clique não era o passo pedido.');nx=fim?'Missão pronta! Clique em "Voltar ao mapa".':m.steps[ST.i].say}
 return 'O que eu vejo na sua tela:\n• '+L.join('\n• ')+'\n\nPróximo passo: '+nx}

function tutorChips(){const c=tutorCtx(),asked=TQ.msgs.filter(m=>m.u).map(m=>m.t);return [{q:'Analise a minha tela',diag:true}].concat((TFAQ[c]||[]).concat(TFAQ.geral).filter(it=>!asked.includes(it.q))).slice(0,6)}
function tutorAnswer(text,item){TQ.msgs.push({u:true,t:text});TQ.busy=true;tutorPaint();
 setTimeout(()=>{let a,extra=false;if(item&&item.diag)a=tutorDiagnose();else if(item){a=item.a}else{const m=tutorMatch(text);
  if(m){a=m.a;tutorLog(text,true)}else if(/analis|minha tela|o que faco|perdid|travei|travado|socorro|ajuda|e agora|nao sei/.test(nrm(text)))a=tutorDiagnose();

function proximaMissao(){return ALL.find(x=>!S.done[x[0]]&&lib(x[0]))}
function homeSay(){const n=S.name,a=MV(),nx=proximaMissao(),feitos=ALL.filter(x=>S.done[x[0]]).length;let tx;
 const lab=nx?`${nx[1]} ${nx[2]}`:'';
 if(!feitos)tx=`Oi, ${n}! Eu sou ${a.n}. Você vai montar uma central de atendimento de verdade no Chatwoot, um passo de cada vez. Dê uma olhada no sumário e clique em Começar.`;
 else if(!nx)tx=`Parabéns, ${n}! Você concluiu os 4 Mundos do curso: atender, montar a equipe, organizar com etiquetas, respostas prontas, macros e automações, e ligar o Chatwoot ao n8n. Clique em "Ver meu certificado". Guarde a apostila: ela é a sua cola.`;

 else if(S.done.q2&&!S.done.q3)tx=`Mundo 2 concluído, ${n}! O Mundo 3 ensina a organizar e ganhar tempo: etiquetas, respostas prontas, macros, automações e filtros. Clique em "${lab}".`;
 else if(S.done.q1&&!S.done.q2)tx=`Que bom te ver de volta, ${n}! O Mundo 1 está concluído e o Mundo 2 já está aberto. Clique em "${lab}".`;
 else tx=`Oi, ${n}! Aqui está o sumário. Você já tem missões feitas. Clique em Continuar de onde parei.`;
 if(!S.done.q2){if(S.goal==='tool')tx+=' Seu objetivo é dominar a ferramenta: no fim do Mundo 2 você já sabe montar a central do zero.';else if(S.goal==='biz')tx+=' Seu objetivo é organizar o atendimento do seu negócio: aplique cada missão na sua loja assim que terminar.';else tx+=' Escolha o seu objetivo logo acima do botão: aprender a ferramenta ou organizar o atendimento do seu negócio.'}
 return tx}

function home(){
 limpaDock();CUR={view:'home',k:null};
 const total=ALL.length,feitos=ALL.filter(m=>S.done[m[0]]).length,nx=proximaMissao();
 const card=w=>`<div class="hcard"><span class="hn">${w.n}</span><h3>Mundo ${w.n} · ${w.t}</h3><ul>${w.it.map(m=>{const l=lib(m[0]),q=/^q/.test(m[0]);return `<li><button class="hit${S.done[m[0]]?' dn':''}" ${l?'':'disabled'} data-m="${m[0]}"><i>${q?'★':m[1]}</i><span>${m[2]}</span>${S.done[m[0]]?'<em class="ok">✔</em>':l?'':'<em>🔒</em>'}</button>${apLink(m[0])}</li>`}).join('')}</ul></div>`;
 const ponte=`<div class="hcard ponte"><span class="hn">→</span><h3>Depois do Chatwoot: o curso de n8n</h3><p class="ds">No Mundo 4 você viu o n8n responder pelo Chatwoot. O curso de n8n ensina a construir esse fluxo do zero, com webhooks, decisões e agentes de IA.</p>${N8N_CURSO?`<a class="btn" href="${N8N_CURSO}" target="_blank" rel="noopener">Abrir o curso de n8n</a>`:''}</div>`;
 const futuro=w=>`<div class="hcard soon"><span class="hn">${w.n}</span><h3>Mundo ${w.n} · ${w.t}</h3><ul>${w.it.map(m=>`<li><button class="hit" disabled><i>${m[0]}</i><span>${m[1]}</span></button></li>`).join('')}</ul><div class="emb">Em breve</div></div>`;
 app.innerHTML=`<div class="hm"><header class="hmh"><div class="lgx"><img src="${LOGO_URI}" alt="Agente 3D"><b>Chatwoot Academia Agente3d</b></div><div class="hr2"><span class="xp">⭐ ${S.xp} XP</span><a href="gestor.html" class="btn g" style="text-decoration:none; color:inherit; font-size:12px; padding:6px 10px;">Painel do Gestor</a><button class="btn g" id="sair">Sair</button></div></header>
 <section class="hhero"><h1>Olá, ${esc(S.name)}!</h1><p>${feitos} de ${total} etapas concluídas. Cada missão leva uns minutos: o mentor fala, mostra onde clicar e você pratica.</p>
 <div class="goal"><span>Seu objetivo:</span><button class="chp${S.goal==='tool'?' on':''}" data-g="tool">Aprender a ferramenta</button><button class="chp${S.goal==='biz'?' on':''}" data-g="biz">Organizar o meu negócio</button></div>
 <button class="go sm" id="cont">${!nx?'Ver meu certificado':feitos?'Continuar de onde parei':'Começar o curso'}</button><a class="apl2" href="${APOSTILA_BASE}" target="_blank" rel="noopener">📖 Abrir a apostila</a></section>

 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>QUIZ[b.dataset.m]?quiz(b.dataset.m):lab(b.dataset.m));

 dockSync();mentorBalao(true);
}

 const n8nv=`<div class="n8"><div class="n8h"><b>Atendimento com IA</b><span class="n8s">Salvo</span><span class="sp"></span><button class="n8r${P('n8n-run')}" data-id="n8n-run" type="button">▶ Executar workflow</button></div><div class="n8c"><div class="n8row">${NOD.map((n,i)=>`${i?'<i class="n8l"></i>':''}<button type="button" class="n8n${ST.node===n[0]?' nsel':''}${P(n[0])}" data-id="${n[0]}"><span class="n8i" style="background:${n[2]}">${n[3]}</span><small>${n[1]}</small>${ST.ran?'<em class="n8ok">✓</em>':''}</button>`).join('')}</div>${ST.node?`<div class="n8p"><b>${NTX[ST.node][0]}</b><p>${NTX[ST.node][1]}</p></div>`:'<div class="n8p dim">Clique em um bloco para ver o que ele faz.</div>'}${ST.ran?`<button class="bt${P('n8n-open-cw')}" data-id="n8n-open-cw" type="button" style="margin-top:16px">Abrir o Chatwoot e ver a resposta</button>`:''}</div></div>`;

 const nv=$('.nv');if(nv){nv.scrollTop=navSc;const pl=nv.querySelector('.pulse');if(pl){const a=nv.getBoundingClientRect(),b=pl.getBoundingClientRect();if(b.bottom>a.bottom-8||b.top<a.top+8)nv.scrollTop+=b.top-a.top-a.height/2}}
 if(fa){const e=document.getElementById(fa);if(e){e.focus();const l=e.value.length;e.setSelectionRange(l,l)}}

 let alvo=null;if(m.tour&&!fim){alvo=st.el&&st.el();if(alvo)alvo.classList.add('pulse')}

 alvo=alvo||(fim?null:document.querySelector('.sim .pulse,.modal .pulse'));maoPara(alvo);

let MAO=null;
function maoOff(){if(MAO){MAO.remove();MAO=null}}
function maoPara(el){if(!el){maoOff();return}
 let dy=0,sc=null;
 try{let c=el.parentElement;while(c&&c!==document.body){const o=getComputedStyle(c).overflowY;if((o==='auto'||o==='scroll')&&c.scrollHeight>c.clientHeight+2){sc=c;break}c=c.parentElement}
  if(sc){const cr=sc.getBoundingClientRect(),er=el.getBoundingClientRect(),m=14,room=cr.height-2*m;
   if(er.height>room){if(Math.abs(er.top-cr.top-m)>3)dy=er.top-cr.top-m}
   else if(er.bottom>cr.bottom-m)dy=er.bottom-cr.bottom+m+70;else if(er.top<cr.top+m)dy=er.top-cr.top-m;
   dy=Math.max(-sc.scrollTop,Math.min(dy,sc.scrollHeight-sc.clientHeight-sc.scrollTop));
   if(Math.abs(dy)>2)sc.scrollTo({top:sc.scrollTop+dy,behavior:'smooth'});else dy=0}
  window.scrollTo(0,0)}catch(e){}
 const poe=(fin)=>{const r=el.getBoundingClientRect();const pr=fin?r:{left:r.left,width:r.width,height:r.height,top:r.top-dy,bottom:r.bottom-dy};
  if(!S.mao||!pr.width||pr.bottom<0||pr.top>innerHeight){if(fin)maoOff();return}
  const x=pr.left+Math.min(pr.width*.6,120),y=pr.top+Math.min(pr.height*.6,60);
  if(!MAO){MAO=document.createElement('div');MAO.className='mao';MAO.style.transition='none';MAO.innerHTML='<svg viewBox="0 0 44 54" width="44" height="54"><path d="M13 3.5c-2.2 0-3.8 1.6-3.8 3.8v21.6l-3.2-3.4c-1.5-1.5-3.9-1.5-5.2 0-1.3 1.4-1.2 3.6.2 5l9.6 11.8c1.6 2 4.1 3.2 6.7 3.2h12.4c4 0 7.3-3.1 7.7-7.1l1.2-12.4c.2-1.8-1.1-3.3-2.8-3.5-1.1-.1-2.1.4-2.8 1.2-.6-1.5-2.2-2.4-3.9-2.1-.9.1-1.7.6-2.3 1.3-.8-1.5-2.5-2.3-4.2-1.9-.7.2-1.3.5-1.8 1V7.3c0-2.2-1.6-3.8-3.8-3.8z" fill="#fff" stroke="#1b2a3a" stroke-width="2.4" stroke-linejoin="round"/></svg>';document.body.appendChild(MAO);MAO.style.left=(x-13)+'px';MAO.style.top=(y-3)+'px';MAO.offsetHeight;MAO.style.transition=''}
  else{MAO.style.left=(x-13)+'px';MAO.style.top=(y-3)+'px'}};
 if(!S.mao){maoOff();return}
 poe(false);if(dy){const my=MAO;setTimeout(()=>{if(MAO===my&&document.body.contains(el))poe(true)},650)}}
function tourGo(d){pararVoz();ST.started=1;ST.i=Math.max(0,ST.i+d);ST.err='';draw()}
function tourFala(vk){setTimeout(()=>{if(ST.vk!==vk||CUR.view!=='lab')return;const k=ST.k,i=ST.i,t0=Date.now();
 falar(linhasDaTela(),()=>{if(!S.voz||!ST.auto||ST.k!==k||ST.i!==i||CUR.view!=='lab')return;const w=Math.max(800,2200-(Date.now()-t0));
  setTimeout(()=>{if(ST.k===k&&ST.i===i&&ST.auto&&CUR.view==='lab'&&ST.i<MIS[k].steps.length)tourGo(1)},w)})},850)}
function labBalao(m,st,fim){let b=document.getElementById('mbal');if(!b){b=document.createElement('div');b.id='mbal';b.className='mbal';document.body.appendChild(b)}
 const a=MV(),av=S.av>=0?S.av:3;
 const dots=`<div class="dots">${m.steps.map((_,i)=>`<i class="${i<ST.i?'on':''}"></i>`).join('')}</div>`;
 const tc=m.tour&&!fim?`<div class="tcn"><button type="button" id="tprev" ${ST.i===0?'disabled':''}>‹ Voltar</button><button type="button" id="tauto">${ST.auto?'⏸ Pausar':'▶ Automático'}</button><button type="button" class="pri" id="tnext">${ST.i===m.steps.length-1?'Concluir ›':'Próximo ›'}</button></div><button type="button" class="lnk" id="tskip">Pular tour</button>`:'';
 const txt=fim?`<p><b>${m.tour?'Tour concluído!':'Missão cumprida!'} 🎉 +${m.xp} XP</b></p><p>${m.fim}</p>${ST.k==='m42'&&N8N_CURSO?`<a class="btn" href="${N8N_CURSO}" target="_blank" rel="noopener" style="display:inline-block;margin:8px 8px 0 0;text-decoration:none">Abrir o curso de n8n</a>`:''}<button class="btn" id="done" style="margin-top:8px">Voltar ao mapa</button>`:`${ST.i===0&&!ST.started?`<p>${m.intro}</p>`:''}<p>${st.say}</p>${ST.err?`<p class="mhint">${ST.err}</p>`:''}${tc}`;
 b.innerHTML=`${HM.min?'':`<div class="mbub"><div class="mbh"><span>${esc(a.n.toUpperCase())}</span><button type="button" id="mhand" title="Mostrar ou esconder a mãozinha" class="${S.mao?'':'off'}">✋</button><button type="button" id="mrep" title="Ouvir de novo">↻</button><button type="button" id="mmin" title="Minimizar">–</button><button type="button" id="mmu" title="Ligar/desligar a voz">${S.voz?'🔊':'🔇'}</button></div>${dots}${txt}</div>`}<button type="button" class="mav" id="mfig" title="${HM.min?'Abrir o mentor':'Mentor'}">${mSvg(av)}</button>`;
 const g=id=>document.getElementById(id);
 b.classList.remove('top','left');const hit=()=>{const r=b.getBoundingClientRect();return [...document.querySelectorAll('.sim .pulse,.modal .pulse')].some(e=>{const q=e.getBoundingClientRect();return q.right>r.left&&q.left<r.right&&q.bottom>r.top&&q.top<r.bottom})};
 if(hit()){b.classList.add('top');if(hit()){b.classList.remove('top');b.classList.add('left')}}
 if(g('mhand'))g('mhand').onclick=()=>{S.mao=!S.mao;save();draw()};
 if(g('tprev'))g('tprev').onclick=()=>tourGo(-1);if(g('tnext'))g('tnext').onclick=()=>tourGo(1);
 if(g('tauto'))g('tauto').onclick=()=>{ST.auto=!ST.auto;if(ST.auto)ST.vk=null;draw()};
 if(g('tskip'))g('tskip').onclick=()=>{pararVoz();maoOff();S.done[ST.k]=1;save();home()};
 if(g('mmin'))g('mmin').onclick=()=>{HM.min=true;pararVoz();labBalao(m,st,fim)};
 if(g('mmu'))g('mmu').onclick=()=>{S.voz=!S.voz;save();if(!S.voz)pararVoz();else falar(linhasDaTela());labBalao(m,st,fim)};
 if(g('mrep'))g('mrep').onclick=()=>{const v=S.voz;S.voz=true;falar(linhasDaTela());S.voz=v};
 g('mfig').onclick=()=>{if(HM.min){HM.min=false;labBalao(m,st,fim)}else{const v=S.voz;S.voz=true;falar(linhasDaTela());S.voz=v}};
 if(g('done'))g('done').onclick=()=>{pararVoz();maoOff();if(!S.done[ST.k]){S.done[ST.k]=1;S.xp+=m.xp}save();home()}}
function typed(id,val){const m=MIS[ST.k];if(ST.i>=m.steps.length)return;const st=m.steps[ST.i];
 if(st.type&&st.go===id&&st.type(val)){st.after&&st.after();ST.i++;ST.err='';draw()}}
function click(id){
 const m=MIS[ST.k];if(m.tour||ST.i>=m.steps.length)return;const st=m.steps[ST.i];
 if(st.type){ST.err='Digite no campo brilhante. '+st.hint;draw();return}
 if(id===st.go){ST.started=1;ST.err='';
  if(id==='menu-conv')ST.view='conv';
  st.after&&st.after();ST.i++;draw();
 }else{ST.err='Quase! '+st.hint;draw()}
}
function quiz(k){
 limpaDock();pararVoz();CUR={view:'quiz',k};
 const Q=QUIZ[k],w=+k.slice(1),need=k==='q4'?12:4,fin=k==='q4';
 app.innerHTML=`<div class="center"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><button class="btn g" id="back">← Mapa</button><b>${fin?'Quiz final':'Quiz do Mundo '+w}</b><span></span></div>
 ${Q.map((q,i)=>`<div class="q"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}</div>`).join('')}
 <button class="btn" id="ok">Corrigir</button><div id="res"></div></div></div>`;
 dockSync();$('#back').onclick=home;mentorBalao(true,fin?`Chegou o quiz final, ${S.name}! São ${Q.length} perguntas com tudo o que você viu. Responda com calma e clique em Corrigir. Com ${need} acertos você recebe o certificado.`:`Hora do quiz do Mundo ${w}, ${S.name}! São ${Q.length} perguntas sobre o que você praticou. Responda com calma e clique em Corrigir. Você precisa de ${need} acertos.`);
 $('#ok').onclick=()=>{let n=0;Q.forEach((q,i)=>{const c=document.querySelector(`input[name=q${i}]:checked`);if(c&&+c.value===q[2])n++});
  const pass=n>=need;mentorBalao(true,pass?(fin?`Parabéns, ${S.name}! ${n} de ${Q.length}. Você concluiu o curso. Clique em Ver meu certificado.`:`Mandou bem, ${S.name}! ${n} de ${Q.length}. O Mundo ${w} está concluído. Clique em Voltar ao mapa.`):`Você fez ${n} de ${Q.length}. Falta pouco: releia a apostila, ajuste as respostas e corrija de novo. Você precisa de ${need} acertos.`);
  $('#res').innerHTML=`<p class="${pass?'good':'bad'}">${n} de ${Q.length}. ${pass?(fin?'Curso concluído! 🎉 +100 XP':'Mundo '+w+' concluído! 🎉 +50 XP'):'Precisa de '+need+' acertos. Tente de novo.'}</p>${pass?(fin?'<button class="btn" id="vc">Ver meu certificado</button>':'<button class="btn" id="vm">Voltar ao mapa</button>'):''}`;
  if(pass){if(!S.done[k]){S.done[k]=1;S.xp+=fin?100:50}save();if($('#vm'))$('#vm').onclick=home;if($('#vc'))$('#vc').onclick=cert}};
}

 $('#back').onclick=home;$('#prt').onclick=()=>window.print()}

function irPara(k,n){if(!S.name)S.name='Aluna';if(S.av<0)S.av=3;save();
 if(k[0]==='q'){quiz(k);return}
 lab(k);if(n>0){const m=MIS[k];ST.txt='Mensagem de teste';ST.vals={inp:'Diego',inp2:'diego@exemplo.com'};
  for(let i=0;i<n&&i<m.steps.length;i++){const st=m.steps[i];try{if(st.go==='menu-conv')ST.view='conv';st.after&&st.after()}catch(e){}}
  ST.started=1;ST.i=Math.min(n,m.steps.length);ST.vk=null;draw()}}

 p=document.createElement('div');p.id='atl';
 p.innerHTML=`<div class="atlh"><b>⚡ Atalhos (só para você)</b><button type="button" id="atx">×</button></div>

 <div class="atll">${ALL.map(x=>{const m=MIS[x[0]];return `<div class="atlr"><span>${x[1]} ${x[2]}</span>${m?`<select data-s="${x[0]}">${m.steps.map((_,i)=>`<option value="${i}">passo ${i+1}</option>`).join('')}</select>`:''}<button type="button" data-g="${x[0]}">Ir</button></div>`}).join('')}</div>
 <small>Atalho no teclado: Alt+Shift+A. Link direto: ...index.html#m10/17 (missão e passo).</small>`;
 document.body.appendChild(p);
 p.querySelector('#atx').onclick=()=>p.remove();
 p.querySelector('#atlv').onchange=e=>{S.livre=e.target.checked;save()};

const _h=location.hash.match(/^#(m\d{2}|q\d)(?:\/(\d+))?$/);

// Redireciona #gestor diretamente para gestor.html
if (location.hash === '#gestor' || location.hash === '#gestor-entrar') {
  location.replace('gestor.html');
}

// Inicialização com revalidação de sessão no servidor
var sess = null;
try { sess = JSON.parse(localStorage.getItem(KEY + '_sess')); } catch (e) {}

if (sess && sess.u && sess.h) {
  doLogin(sess.u, null, sess.h).then(enterSession).catch(function(err) {
    try { localStorage.removeItem(KEY + '_sess'); } catch (e) {}
    if (err === 'bloqueado') {
      loginView('Seu acesso a este curso está pausado ou não liberado. Fale com o seu gestor.');
    } else {
      loginView();
    }
  });
} else if (!S.logged) {
  loginView();
} else {
  welcome();
  if(_h&&(MIS[_h[1]]||QUIZ[_h[1]]))setTimeout(()=>irPara(_h[1],+(_h[2]||0)),60);else if(location.hash==='#atalhos')setTimeout(()=>atalhos(true),60);
}

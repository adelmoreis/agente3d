<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área de Membros - Login do Funcionário | MediClinic 3Dígitos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-emerald-950 to-slate-900 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-3xl p-8 shadow-2xl space-y-6 relative border border-white/20">
    
    <!-- HEADER DA TELA DE LOGIN -->
    <div class="text-center space-y-2">
      <div class="w-16 h-16 bg-emerald-100 text-emerald-700 rounded-2xl flex items-center justify-center mx-auto text-2xl font-bold shadow-sm">
        <i class="fa-solid fa-user-lock"></i>
      </div>
      <h1 class="text-2xl font-bold text-slate-900">Área do Funcionário</h1>
      <p class="text-xs text-slate-500">Acesso Restrito à Gestão de Agendamentos e Recepção</p>
    </div>

    <!-- ALERTA DE CREDENCIAIS DE DEMONSTRAÇÃO COM SELEÇÃO DE PERFIL -->
    <div class="bg-emerald-50 border border-emerald-200 p-3.5 rounded-2xl text-xs text-emerald-900 space-y-2">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-user-gear text-emerald-600 text-sm"></i>
        <span class="font-extrabold block">Selecione o Perfil de Acesso para Teste:</span>
      </div>
      <div class="grid grid-cols-1 gap-1.5 pt-1">
        <button type="button" onclick="preencherCredencial('admin@clinica.com', 'admin123')" class="px-2.5 py-1.5 bg-white border border-emerald-300 hover:bg-emerald-100 rounded-xl text-left transition font-bold text-slate-800 flex items-center justify-between">
          <span>👑 Recepção / Administração</span>
          <span class="text-[10px] text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-md">Todos os Recursos</span>
        </button>
        <button type="button" onclick="preencherCredencial('doctor.roberto@clinica.com', 'admin123')" class="px-2.5 py-1.5 bg-white border border-emerald-300 hover:bg-emerald-100 rounded-xl text-left transition font-bold text-slate-800 flex items-center justify-between">
          <span>🩺 Dr. Roberto Silva (Cardiologia)</span>
          <span class="text-[10px] text-sky-800 bg-sky-100 px-2 py-0.5 rounded-md">Área do Médico</span>
        </button>
        <button type="button" onclick="preencherCredencial('3digitos2023@gmail.com', 'admin123')" class="px-2.5 py-1.5 bg-white border border-emerald-300 hover:bg-emerald-100 rounded-xl text-left transition font-bold text-slate-800 flex items-center justify-between">
          <span>🩺 Dr. João Almeida (Clínica Geral)</span>
          <span class="text-[10px] text-sky-800 bg-sky-100 px-2 py-0.5 rounded-md">Área do Médico</span>
        </button>
      </div>
    </div>

    <!-- FORMULÁRIO DE LOGIN -->
    <form onsubmit="realizarLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">E-mail Profissional</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
            <i class="fa-regular fa-envelope"></i>
          </span>
          <input type="email" id="login-email" required value="admin@clinica.com" class="w-full pl-10 pr-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Senha de Acesso</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" id="login-senha" required value="admin123" class="w-full pl-10 pr-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
      </div>

      <button type="submit" id="btn-login-submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transition text-sm flex items-center justify-center gap-2">
        <i class="fa-solid fa-right-to-bracket"></i> Entrar na Área de Membros
      </button>
    </form>

    <div class="text-center pt-2">
      <a href="/" class="text-xs text-slate-500 hover:text-emerald-700 font-medium">
        <i class="fa-solid fa-arrow-left mr-1"></i> Voltar ao Site Institucional Público
      </a>
    </div>

  </div>

  <script>
    function preencherCredencial(email, pass) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-senha').value = pass;
    }

    async function realizarLogin(event) {
      event.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-senha').value;
      const btn = document.getElementById('btn-login-submit');

      try {
        btn.disabled = true;
        btn.innerText = 'Autenticando...';

        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, pass })
        });

        const data = await res.json();

        if (!res.ok) {
          alert('❌ Falha na Autenticação: ' + (data.message || 'E-mail ou senha incorretos'));
          btn.disabled = false;
          btn.innerText = 'Entrar na Área de Membros';
          return;
        }

        // Armazena Token e dados do usuário logado no localStorage
        localStorage.setItem('clinic_token', data.accessToken);
        localStorage.setItem('clinic_user', JSON.stringify(data.user));

        // Redireciona para o Painel Interno de Membros / Funcionários
        window.location.href = '/admin.html';
      } catch (err) {
        alert('Erro ao comunicar com o servidor: ' + err.message);
        btn.disabled = false;
        btn.innerText = 'Entrar na Área de Membros';
      }
    }
  </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031525"/>
      <stop offset="60%" stop-color="#09223b"/>
      <stop offset="100%" stop-color="#02101e"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="75%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bg2)"/>
  <rect width="800" height="480" fill="url(#glowBlue)"/>
  <rect width="800" height="480" fill="url(#glowOrange)"/>

  <!-- Elemento gráfico Chatwoot + WhatsApp -->
  <g transform="translate(510, 110)" filter="url(#shadow2)">
    <rect width="230" height="230" rx="36" fill="#0c4a6e" fill-opacity="0.5" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2"/>
    <circle cx="115" cy="115" r="70" fill="#0284c7" fill-opacity="0.2"/>
    
    <!-- Ícone Chatwoot Simbolizado -->
    <path d="M75 145 C65 145 60 135 60 120 C60 90 85 70 120 70 C155 70 180 90 180 120 C180 150 155 170 120 170 C105 170 95 166 85 160 L60 168 L68 148 Z" fill="#38bdf8" opacity="0.9"/>
    <circle cx="100" cy="118" r="8" fill="#ffffff"/>
    <circle cx="125" cy="118" r="8" fill="#ffffff"/>
    <circle cx="150" cy="118" r="8" fill="#ffffff"/>
  </g>

  <!-- Pill Badge -->
  <g transform="translate(60, 60)">
    <rect width="230" height="34" rx="17" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#38bdf8"/>
    <text x="34" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#7dd3fc" letter-spacing="1.5">SISTEMAS 3DÍGITOS</text>
  </g>

  <!-- Título -->
  <text x="60" y="150" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Atendimento Omnichannel
  </text>
  <text x="60" y="195" font-family="system-ui, sans-serif" font-size="38" font-weight="900" fill="#38bdf8" letter-spacing="-0.5">
    Chatwoot + Agente3d
  </text>

  <!-- Descrição -->
  <text x="60" y="245" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8" font-weight="500">
    Centralize WhatsApp, Instagram e E-mail em uma única tela
  </text>
  <text x="60" y="272" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8" font-weight="500">
    conectada aos fluxos inteligentes de automação do n8n.
  </text>

  <!-- Badges inferiores -->
  <g transform="translate(60, 360)">
    <rect width="200" height="56" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1">INTEGRAÇÃO NATIVA</text>
    <text x="20" y="47" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#38bdf8">WhatsApp + Webhook</text>

    <rect x="220" width="200" height="56" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="240" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1">GESTÃO DE EQUIPE</text>
    <text x="240" y="47" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#10b981">Transbordo Humano</text>
  </g>
</svg>
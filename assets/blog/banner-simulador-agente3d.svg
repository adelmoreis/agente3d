<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="70%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ff6d5a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg3)"/>
  <rect width="800" height="480" fill="url(#glowRed)"/>

  <!-- Nós n8n desenhados em estilo vetor -->
  <g transform="translate(500, 100)">
    <!-- Nó 1: Webhook -->
    <rect x="0" y="30" width="120" height="60" rx="12" fill="#ffffff" stroke="#ff6d5a" stroke-width="3"/>
    <rect x="0" y="30" width="36" height="60" rx="12" fill="#ff6d5a"/>
    <text x="44" y="66" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e293b">Webhook</text>
    
    <!-- Linha de conexão -->
    <line x1="120" y1="60" x2="160" y2="60" stroke="#ff6d5a" stroke-width="3" stroke-dasharray="4"/>
    
    <!-- Nó 2: IF -->
    <rect x="160" y="30" width="110" height="60" rx="12" fill="#ffffff" stroke="#ff6d5a" stroke-width="3"/>
    <rect x="160" y="30" width="36" height="60" rx="12" fill="#ff6d5a"/>
    <text x="204" y="66" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e293b">IF</text>

    <!-- Saída True/False -->
    <line x1="270" y1="50" x2="310" y2="20" stroke="#10b981" stroke-width="3"/>
    <line x1="270" y1="70" x2="310" y2="100" stroke="#f43f5e" stroke-width="3"/>

    <!-- Nó 3: Merge -->
    <rect x="120" y="160" width="130" height="60" rx="12" fill="#ffffff" stroke="#5b4ee8" stroke-width="3"/>
    <rect x="120" y="160" width="36" height="60" rx="12" fill="#5b4ee8"/>
    <text x="164" y="196" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e293b">Merge</text>
  </g>

  <!-- Pill Badge -->
  <g transform="translate(60, 60)">
    <rect width="210" height="34" rx="17" fill="#ff6d5a" fill-opacity="0.2" stroke="#ff6d5a" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#ff6d5a"/>
    <text x="34" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffa394" letter-spacing="1.5">SIMULADOR AGENTE3D</text>
  </g>

  <text x="60" y="150" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Por Dentro do Simulador:
  </text>
  <text x="60" y="195" font-family="system-ui, sans-serif" font-size="38" font-weight="900" fill="#ff6d5a" letter-spacing="-0.5">
    O Pedido da Carla Dias
  </text>

  <text x="60" y="245" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8" font-weight="500">
    Aprenda na prática como receber requisições POST, validar
  </text>
  <text x="60" y="272" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8" font-weight="500">
    regras condicionais com IF e combinar dados com Merge.
  </text>

  <g transform="translate(60, 360)">
    <rect width="180" height="56" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1">MUNDOS 1 E 2</text>
    <text x="20" y="47" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ff6d5a">Casos Práticos Reais</text>

    <rect x="200" width="200" height="56" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="220" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1">SEM ERRO DE PRODUÇÃO</text>
    <text x="220" y="47" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#10b981">Treine no Simulador</text>
  </g>
</svg>